# Builds the public .ipk (no app/private/) and publishes it as a GitHub release.
#  - a tag v* (v1.1.0): a release of that name; with a hyphen (v1.1.0-rc.1) a prerelease
#  - a push to main: adds a build of that commit to the rolling prerelease "dev", which keeps the last 5 builds (so a
#    Channel that still lists the previous build can install it)
# Work lands on main through pull requests; ci.yml builds and tests each pull request (Node 22, as here) without publishing, so a test that
# fails on CI's Node (1.0.9009 and 1.0.9010 failed: Node 22's `node --test` does not take a folder) is caught before main.
name: release
# ovsteenb/lumen-webos (the webOS 4 fork): only main publishes dev builds (other branches are pull requests, checked by ci.yml); Run workflow builds by hand.
on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
# one run at a time: two pushes close together must not race on the dev release or the hbc-repo branch
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # Run workflow publishes only from main (or a tag): a branch run by hand would put an unreviewed build on the dev channel
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches appinfo.json and is above every dev build
        # a stable 1.0.10 would sort below the 1.0.9xxx dev builds and never be offered to a TV on dev: a tag must be newer than all of them
        # (bump the minor, e.g. 1.1.0), and name the version appinfo.json carries
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('app/public/appinfo.json'))['version'])")
          [ "v$V" = "${REF%%-*}" ] || { echo "::error::tag $REF does not match appinfo.json version $V"; exit 1; }
          # the dev builds published so far; no dev release yet is fine, any other failure (auth, network) stops the release rather than
          # letting a tag below them through unchecked
          if NAMES=$(gh release view dev --json assets -q '.assets[].name' 2>gh-err.txt); then :
          elif grep -qi 'release not found' gh-err.txt; then NAMES=""
          else echo "::error::could not read the dev release: $(cat gh-err.txt)"; exit 1; fi
          TOP=$(printf '%s\n' "$NAMES" | sed -n 's/^com\.ovsteenb\.lumen_\([0-9.]*\)_.*\.ipk$/\1/p' | sort -V | tail -n 1)
          if [ -n "$TOP" ] && [ "$(printf '%s\n%s\n' "$TOP" "$V" | sort -V | tail -n 1)" != "$V" -o "$TOP" = "$V" ]; then
            echo "::error::$V is not above the newest dev build $TOP"; exit 1
          fi
      - name: Version
        # dev builds get a rising patch number (1.0.9 -> 1.0.9xxx, from the run number) so the Homebrew Channel offers each one as an update;
        # a tagged release keeps the version in appinfo.json
        if: github.ref_type != 'tag'
        run: |
          python3 - <<'PY'
          import json, os
          p = 'app/public/appinfo.json'; d = json.load(open(p))
          a, b, c = (int(x) for x in d['version'].split('.'))
          d['version'] = f"{a}.{b}.{c * 1000 + int(os.environ['GITHUB_RUN_NUMBER'])}"
          json.dump(d, open(p, 'w'), indent=2); print(d['version'])
          PY
      - name: Build the .ipk
        # branch pushes are dev builds (Settings > Frame-rate counter); a tag without a hyphen is stable
        env:
          LUMEN_DEV: ${{ (github.ref_type == 'tag' && !contains(github.ref_name, '-')) && '0' || '1' }}
        run: python3 tools/build_release.py
      - name: Test
        # unit tests in tools/test/ (use esbuild from app/node_modules, installed by the build)
        run: node --test tools/test/*.test.mjs
      - name: Build Lumen bar
        # the overlay app (bar/), same version as Lumen
        run: LUMEN_BUILD_DIR=release sh tools/build_bar.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
        run: |
          IPKS=$(ls release/*.ipk)
          { printf 'Built from %s.\n\nInstall: drop the .ipk onto Dev Manager, or `ares-install --device lgtv <file>`.\n\n' "$GITHUB_SHA"
            for f in $IPKS; do printf -- '- `%s` SHA-256: `%s`\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"; done; } > notes.md
          if [ "$REF_TYPE" = tag ]; then
            TAG=$REF; PRE=; case "$TAG" in *-*) PRE=--prerelease ;; esac
            gh release create "$TAG" $IPKS --target "$GITHUB_SHA" --title "Lumen $TAG ($REF, ${GITHUB_SHA:0:7})" --notes-file notes.md $PRE
          else
            # add this build to "dev" instead of replacing the release, then drop all but the newest 5 builds
            TAG=dev
            gh release view dev >/dev/null 2>&1 || gh release create dev --target "$GITHUB_SHA" --title "Lumen dev" --notes-file notes.md --prerelease
            gh release upload dev $IPKS --clobber
            gh release edit dev --title "Lumen dev ($REF, ${GITHUB_SHA:0:7})" --notes-file notes.md
            # the newest 5 builds of each app (Lumen, Lumen bar)
            for app in com.ovsteenb.lumen_ com.ovsteenb.lumen.bar_; do
              gh release view dev --json assets -q '.assets[].name' | grep "^${app}[0-9].*\.ipk$" | sort -V | head -n -5 | while read -r old; do gh release delete-asset dev "$old" --yes; done
            done
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Homebrew Channel repository
        # a prerelease tag (v1.1.0-rc.1) is a GitHub prerelease only: it would replace the dev index with a build lower than the dev builds
        if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
        # The Channel reads the index with XHR, so it is served from raw.githubusercontent.com (CORS allowed) on the hbc-repo branch:
        #   dev builds:     https://raw.githubusercontent.com/<repo>/hbc-repo/dev/apps.json
        #   tagged release: https://raw.githubusercontent.com/<repo>/hbc-repo/stable/apps.json
        # The fork also serves the hbc-repo branch with GitHub Pages (CORS allowed too), as ovsteenb/webos-av-overlay is served:
        #   https://<owner>.github.io/<repo>/dev/apps.json and .../stable/apps.json
        run: |
          CHANNEL=stable; [ "$TAG" = dev ] && CHANNEL=dev
          BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/hbc-repo/$CHANNEL"
          ARGS=""
          for f in release/com.ovsteenb.lumen_*.ipk release/com.ovsteenb.lumen.bar_*.ipk; do
            ARGS="$ARGS $f https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$f")"
          done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git fetch origin hbc-repo && git worktree add hbc origin/hbc-repo || { git worktree add --detach hbc && git -C hbc checkout --orphan hbc-repo && git -C hbc rm -rfq .; }
          rm -rf "hbc/$CHANNEL"
          python3 tools/gen_hbc_repo.py "hbc/$CHANNEL" "$BASE" $ARGS
          # a re-run of the same build changes nothing: no empty commit, which failed the step
          cd hbc && git add -A && if git diff --cached --quiet; then echo "hbc-repo already up to date"; else git commit -qm "$CHANNEL: $TAG ${GITHUB_SHA:0:7}" && git push origin HEAD:hbc-repo; fi
