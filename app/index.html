<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1.0" />
    <title>Launcher</title>
    <!-- Cold start (lib/boot.ts, lib/wallpaper.ts): black, then the wallpaper (a bundled one sharp, a cloud one as its blur) before the app's script
         and stylesheet have loaded. Matches #wpimage in global.css. -->
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #wpimage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; background: center / cover no-repeat; }
      html.night #wpimage { opacity: 0.55; }
      #wpimage .wpfade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: center / cover no-repeat; opacity: 0; transition: opacity 450ms ease-out; }
    </style>
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="wpimage"></div>
    <script>
      // The keys are BOOT_WALLPAPER_KEY (lib/boot.ts) and STORAGE_KEY (config/constants.ts); lib/wallpaper.ts takes this element over.
      (function () {
        try {
          var config = JSON.parse(localStorage.getItem('launcher-config-v2') || '{}');
          // Live blur from the first frame, or the glass first shows the heavier blurred copy; Dock blur as lib/storage.ts reads it.
          // No backdrop-filter (webOS 4, Chromium 53): fake glass, the pre-blurred wallpaper copy lined up behind each glass shape (lib/compat.ts)
          var css = window.CSS && CSS.supports;
          var live = !!css && (CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));
          document.documentElement.classList.add(live ? 'liveblur' : 'fakeglass');
          if (config.dockBlur === true) document.documentElement.classList.add('dockblur');
          var boot = JSON.parse(localStorage.getItem('lumen-boot-wallpaper-v1') || 'null');
          if (!boot || !(boot.url || boot.bg)) return;
          if (boot.sel && config.wallpaper && boot.sel !== config.wallpaper) return;
          var root = document.documentElement;
          var hour = new Date().getHours();
          if (config.nightDim === true && (hour >= 19 || hour < 6)) root.classList.add('night');
          root.classList.add('wp-image');
          if (boot.url) {
            // a bundled picture: sharp at once
            if (boot.blur) root.style.setProperty('--wp-blur', boot.blur);
            if (boot.bg) root.style.setProperty('--wp-bg', boot.bg);
            document.getElementById('wpimage').style.backgroundImage = 'url("' + boot.url + '")';
          } else {
            // a cloud or Immich picture: its strong blur (a data: URL) until the sharp one fades in over it
            var bg = 'url("' + boot.bg + '")';
            root.style.setProperty('--wp-bg', bg);
            root.style.setProperty('--wp-blur', boot.blur ? 'url("' + boot.blur + '")' : bg);
            document.getElementById('wpimage').style.backgroundImage = bg;
          }
        } catch (e) { /* no stored wallpaper: the app loads it as before */ }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
